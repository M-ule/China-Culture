name: Apply live input optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-live-input-optimization.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_commit = "function commitRowControl(el,b){const k=el.dataset.k,v=el.value;if(k==='lv'){state[b][k]=clamp(parseInt(v)||1,1,6);const modes=DATA.lm[b+'|'+state[b].lv]||[];if(!modes.includes(state[b].mode))state[b].mode=modes[0]||state[b].mode;}else if(k==='mode'){const modes=DATA.lm[b+'|'+state[b].lv]||[];state[b][k]=modes.includes(v)?v:(modes[0]||state[b].mode);}else if(k==='bldgs'){state[b][k]=Math.max(0,parseFloat(v)||0);}else if(k==='stock'){state[b][k]=Math.round(parseFloat(v)||0);}else if(k==='productStock'){if(b==='비단 작업장')wStock.silk=Math.round(parseFloat(v)||0);else if(b==='도자기 작업장')wStock.porc=Math.round(parseFloat(v)||0);}else if(k==='hours'){const hours=parseFloat(v);state[b][k]=v===''?'':Math.max(0,Number.isFinite(hours)?hours:0);}renderAll();saveState();}\nfunction renderTables(){document.querySelector('#t1 tbody').innerHTML=rowResource('쌀 농장',riceConsumption)+rowResource('누에 숲',silkwormConsumption)+rowResource('고령토 채석장',kaolinConsumption);document.querySelector('#t2 tbody').innerHTML=rowIntermediate('실 가공소',threadConsumption)+rowIntermediate('점토 가공소',clayConsumption);document.querySelector('#t3 tbody').innerHTML=rowFinal('비단 작업장')+rowFinal('도자기 작업장');document.querySelectorAll('#panel-prod tbody tr').forEach(tr=>{const b=tr.dataset.b;tr.querySelectorAll('[data-k]').forEach(el=>{el.addEventListener('change',()=>commitRowControl(el,b));el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();}});});});}"
          new_commit = "function commitRowControl(el,b){const k=el.dataset.k,v=el.value;if(k==='lv'){state[b][k]=clamp(parseInt(v)||1,1,6);const modes=DATA.lm[b+'|'+state[b].lv]||[];if(!modes.includes(state[b].mode))state[b].mode=modes[0]||state[b].mode;}else if(k==='mode'){const modes=DATA.lm[b+'|'+state[b].lv]||[];state[b][k]=modes.includes(v)?v:(modes[0]||state[b].mode);}else if(k==='bldgs'){state[b][k]=Math.max(0,parseFloat(v)||0);}else if(k==='stock'){state[b][k]=Math.round(parseFloat(v)||0);}else if(k==='productStock'){if(b==='비단 작업장')wStock.silk=Math.round(parseFloat(v)||0);else if(b==='도자기 작업장')wStock.porc=Math.round(parseFloat(v)||0);}else if(k==='hours'){const hours=parseFloat(v);state[b][k]=v===''?'':Math.max(0,Number.isFinite(hours)?hours:0);}return k;}\nfunction renderTables(){document.querySelector('#t1 tbody').innerHTML=rowResource('쌀 농장',riceConsumption)+rowResource('누에 숲',silkwormConsumption)+rowResource('고령토 채석장',kaolinConsumption);document.querySelector('#t2 tbody').innerHTML=rowIntermediate('실 가공소',threadConsumption)+rowIntermediate('점토 가공소',clayConsumption);document.querySelector('#t3 tbody').innerHTML=rowFinal('비단 작업장')+rowFinal('도자기 작업장');}\nfunction refreshProductionCalcCells(){const html=rowResource('쌀 농장',riceConsumption)+rowResource('누에 숲',silkwormConsumption)+rowResource('고령토 채석장',kaolinConsumption)+rowIntermediate('실 가공소',threadConsumption)+rowIntermediate('점토 가공소',clayConsumption)+rowFinal('비단 작업장')+rowFinal('도자기 작업장');const box=document.createElement('tbody');box.innerHTML=html;box.querySelectorAll('tr[data-b]').forEach(src=>{const dst=[...document.querySelectorAll('#panel-prod tr[data-b]')].find(r=>r.dataset.b===src.dataset.b);if(!dst)return;const sc=[...src.children],dc=[...dst.children];sc.forEach((cell,i)=>{if(!cell.classList.contains('calc')||!dc[i])return;dc[i].className=cell.className;dc[i].innerHTML=cell.innerHTML;});});}\nlet liveSaveTimer=null;\nfunction queueLiveSave(){if(liveSaveTimer)clearTimeout(liveSaveTimer);liveSaveTimer=setTimeout(()=>{liveSaveTimer=null;saveState();},250);}\nfunction renderProductionDependents(k){refreshProductionCalcCells();renderWonder();renderSleepReserve();renderPower();if(k==='lv'||k==='mode')renderConversion();if(k==='lv'||k==='bldgs')renderPlanArea();renderViewModes();}"
          if old_commit not in text:
              raise SystemExit('production handler anchor not found')
          text = text.replace(old_commit, new_commit, 1)

          increment_anchor = "function incrementStepInput(input,delta){let cur=parseFloat(input.value);if(isNaN(cur))cur=0;let next=Math.round((cur+delta)*1000000)/1000000;const min=input.min!==''?parseFloat(input.min):null,max=input.max!==''?parseFloat(input.max):null;if(min!==null&&!isNaN(min))next=Math.max(min,next);if(max!==null&&!isNaN(max))next=Math.min(max,next);input.value=String(next);input.dispatchEvent(new Event('change',{bubbles:true}));}"
          delegated = "\n\nconst prodPanel=document.getElementById('panel-prod');\nprodPanel.addEventListener('input',e=>{const el=e.target.closest('[data-k]');if(!el||el.tagName==='SELECT')return;const row=el.closest('tr[data-b]');if(!row)return;const k=commitRowControl(el,row.dataset.b);renderProductionDependents(k);queueLiveSave();});\nprodPanel.addEventListener('change',e=>{const el=e.target.closest('[data-k]');if(!el)return;const row=el.closest('tr[data-b]');if(!row)return;const k=commitRowControl(el,row.dataset.b);renderTables();renderProductionDependents(k);saveState();postSize();});\nprodPanel.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-k]')){e.preventDefault();e.target.blur();}});"
          if increment_anchor not in text:
              raise SystemExit('increment anchor not found')
          text = text.replace(increment_anchor, increment_anchor + delegated, 1)

          start = text.index("document.getElementById('wLv').addEventListener('change'")
          end = text.index("document.getElementById('productRawCycle').addEventListener('change'", start)
          live_settings = """function liveWonderLevel(e,final=false){settings.wLv=clamp(parseInt(e.target.value)||0,0,50);renderBonus();refreshProductionCalcCells();renderWonder();renderSleepReserve();renderPower();renderConversion();renderWonderContext();renderPlan();renderViewModes();if(final)e.target.value=settings.wLv;final?saveState():queueLiveSave();}
document.getElementById('wLv').addEventListener('input',e=>liveWonderLevel(e,false));
document.getElementById('wLv').addEventListener('change',e=>liveWonderLevel(e,true));
function liveBaseHours(e,final=false){const raw=e.target.value.trim();settings.baseH=raw===''?0:Math.max(0,parseFloat(raw)||0);refreshProductionCalcCells();renderWonder();renderSleepReserve();renderPower();renderWonderContext();renderPlanCurrency();renderViewModes();if(final)e.target.value=settings.baseH;final?saveState():queueLiveSave();}
document.getElementById('baseH').addEventListener('input',e=>liveBaseHours(e,false));
document.getElementById('baseH').addEventListener('change',e=>liveBaseHours(e,true));
function liveCurrentLevel(e,final=false){wLvSet.cur=clamp(parseInt(e.target.value)||0,0,50);if(wLvSet.tgt<wLvSet.cur){wLvSet.tgt=wLvSet.cur;document.getElementById('tgtLv').value=wLvSet.tgt;}renderWonder();renderPower();renderViewModes();if(final)e.target.value=wLvSet.cur;final?saveState():queueLiveSave();}
document.getElementById('curLv').addEventListener('input',e=>liveCurrentLevel(e,false));
document.getElementById('curLv').addEventListener('change',e=>liveCurrentLevel(e,true));
function liveTargetLevel(e,final=false){let target=clamp(parseInt(e.target.value)||0,0,50);if(target<wLvSet.cur)target=wLvSet.cur;wLvSet.tgt=target;renderWonder();renderPower();renderViewModes();if(final)e.target.value=target;final?saveState():queueLiveSave();}
document.getElementById('tgtLv').addEventListener('input',e=>liveTargetLevel(e,false));
document.getElementById('tgtLv').addEventListener('change',e=>liveTargetLevel(e,true));
function liveSleepPrep(e,final=false){const v=e.target.value.trim();settings.sleepPrepH=v===''?'':Math.max(0,parseFloat(v)||0);renderSleepReserve();renderViewModes();if(final)e.target.value=settings.sleepPrepH;final?saveState():queueLiveSave();}
document.getElementById('sleepPrepH').addEventListener('input',e=>liveSleepPrep(e,false));
document.getElementById('sleepPrepH').addEventListener('change',e=>{liveSleepPrep(e,true);postSize();});
document.getElementById('sleepCycle').addEventListener('change',e=>{settings.sleepCycle=['최장','30분','1시간','2시간'].includes(e.target.value)?e.target.value:'최장';e.target.value=settings.sleepCycle;renderSleepReserve();renderViewModes();saveState();postSize();});
function liveSleepCount(e,final=false){settings.sleepCount=Math.max(0,Math.floor(parseFloat(e.target.value)||0));renderSleepReserve();renderViewModes();if(final)e.target.value=settings.sleepCount;final?saveState():queueLiveSave();}
document.getElementById('sleepCount').addEventListener('input',e=>liveSleepCount(e,false));
document.getElementById('sleepCount').addEventListener('change',e=>{liveSleepCount(e,true);postSize();});
"""
          text = text[:start] + live_settings + text[end:]

          detail_start = text.index("document.getElementById('detailRows').addEventListener('change'")
          detail_end = text.index("document.getElementById('detailRows').addEventListener('keydown'", detail_start)
          detail_live = """function commitDetailControl(el){const rowEl=el.closest('[data-detail-row]'),idx=rowEl?parseInt(rowEl.dataset.detailRow):-1,d=details[activeDetailBuilding];if(!Number.isInteger(idx)||idx<0||idx>=d.rows.length)return false;const row=d.rows[idx],k=el.dataset.detailK,v=el.value;if(k==='lv'){row.lv=clamp(parseInt(v)||1,1,6);row.mode=normalizedDetailMode(activeDetailBuilding,row.lv,row.mode);}else if(k==='mode'){row.mode=normalizedDetailMode(activeDetailBuilding,row.lv,v);}else if(k==='count'){row.count=Math.max(0,parseFloat(v)||0);}else if(k==='hours'){row.hours=normalizedDetailHours(v);}normalizeDetail(activeDetailBuilding);return true;}
document.getElementById('detailRows').addEventListener('input',e=>{const el=e.target.closest('[data-detail-k]');if(!el||el.tagName==='SELECT')return;if(!commitDetailControl(el))return;refreshProductionCalcCells();renderWonder();renderSleepReserve();renderPower();renderPlanArea();renderViewModes();queueLiveSave();});
document.getElementById('detailRows').addEventListener('change',e=>{const el=e.target.closest('[data-detail-k]');if(!el||!commitDetailControl(el))return;renderAll();renderDetailModal();saveState();});
"""
          text = text[:detail_start] + detail_live + text[detail_end:]

          required = [
              "function refreshProductionCalcCells()",
              "function queueLiveSave()",
              "prodPanel.addEventListener('input'",
              "document.getElementById('wLv').addEventListener('input'",
              "document.getElementById('detailRows').addEventListener('input'",
              "function constructionCurrentLevelOptions(selected)",
              "function renderViewModes()",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing marker: {marker}')

          p.write_text(text, encoding='utf-8')
          PY
      - name: Check JavaScript syntax and preserved features
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>', text, re.S)
          if len(scripts)!=1:
              raise SystemExit(f'unexpected script count: {len(scripts)}')
          Path('/tmp/check.js').write_text(scripts[0], encoding='utf-8')
          checks=['prodViewToggle','wonderViewToggle','cityDetailsToggle','constructionCurrentLevelOptions','renderViewModes','refreshProductionCalcCells','queueLiveSave']
          for c in checks:
              if c not in text:
                  raise SystemExit(f'missing feature: {c}')
          PY
          node --check /tmp/check.js
      - name: Commit optimized index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m '입력값 즉시 반영 및 계산 갱신 최적화'
          git push origin HEAD:main

# trigger run
